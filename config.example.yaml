# Token-Governance 配置模板 —— 复制为 config.yaml 后按本机修改
# 所有路径支持 ~ 展开；相对路径相对 config.yaml 所在目录

# DSH 数据目录（ledger、sessions、profiles 都在里面）
dsh_home: "~/.dsh"

# 多套 DSH 时列在这里（官方版 + 发行版常各有一份）
# dsh_homes:
#   - "~/.dsh"
#   - "~/dsh-next"

# 会话记忆根（对话夹母文件夹）
# 留空 = 首次运行时问你要放哪（setup.py / new_session.py / handoff.py 都会问），默认 ~/Documents/tg-memory
# 填了就按填的建；**不再兜底 ~/tg-memory**（那条静默降级会把「忘配」伪装成「没配」）
memory_root: ""

# 技能目录（放 SKILL.md 的地方）
skills_dir: "~/.dsh/skills"

# 预算告警（可选）：单日 ¥ 超过就提醒
budget:
  daily: null
  weekly: null

# 工具 schema 预算（KB）：超了 preflight 与 schema_budget --check 会报出来
# 参考值：单机 142 个工具 / 122.7 KB（2026-10-25 实测）；新装一个大 MCP 常一次涨 20–50 KB。0 = 关闭检查
schema_budget_kb: 160

# 价格表（可选）：measure_modules 按 token 折算时用；ledger 有实付时以实付为准
prices_usd_per_mtok:
  input: 0.15
  cached: 0.003
  output: 0.6
# USD→CNY 汇率；不写则为 7.1，输出会标注「默认 flash 价（估算）」
rate: 7.1

# 账本 v2：由 scripts/ledger.py 从会话日志派生（替代 2026-10-24 卸载的 dsh-cost-meter 插件）
# 字段与口径见 docs/ledger-v2.md；不写这一节也能跑（用上面 prices_usd_per_mtok 兜底）
ledger:
  path: "data/ledger.json"       # 相对本配置文件所在目录
  timezone: "Asia/Shanghai"
  currency: CNY
  prices:
    currency: USD
    fx:
      usdToCny: 7.1
    peak:
      enabled: false             # 默认关：旧插件的峰谷规则复现不出来，见 docs/ledger-v2.md
      windows: [[1, 4], [6, 10]]
      holidays: []
    # 每模型三档价（USD / 百万 token）；没写 peak 的模型没有峰谷概念（不再默认按 2 倍估）
    models:
      deepseek-flash: { cacheMiss: 0.15, cacheHit: 0.003, output: 0.6,
                        peak: { cacheMiss: 0.3, cacheHit: 0.006, output: 1.2 } }
      deepseek-v4-pro: { cacheMiss: 0.66, cacheHit: 0.022, output: 1.98,
                         peak: { cacheMiss: 1.32, cacheHit: 0.044, output: 3.96 } }
    # 免费通道：命中的模型记 ¥0（tokens 照记）。名单可从 DSH 免费模型目录自动并入，
    # 后缀/通配是兜底规则（新免费模型不改配置也能零价）
    free:
      catalogs:
        - "~/.dsh/our-free-model/catalog.json"
      suffixes: ["-free", ":free"]
      patterns: ["*/free"]
    # provider 默认价：只在模型名对不上、又属于该 provider 时兜底；不写就一律「未定价」
    # providers:
    #   openai: { default: { cacheMiss: 2.5, cacheHit: 1.25, output: 10 } }
    # 缺 source（unknown）的事件按 default 折算；有名有姓但没登记的模型不折价（记 ¥0 并报出来）
    default: { cacheMiss: 0.15, cacheHit: 0.003, output: 0.6,
               peak: { cacheMiss: 0.3, cacheHit: 0.006, output: 1.2 } }
    # 价表快照（DSH 胶囊读它）：默认与账本同目录 prices.json；改完价必须重跑
    #   python scripts/ledger.py prices export
    # export: "data/prices.json"

# 循环守卫（插件 dsh-loop-guard）的默认参数；安装脚本会写进对应 profile 的 loop-guard 条目
loop_guard:
  enabled: true
  thresholds: [2, 4, 6]      # 第 2/4/6 次完全相同调用时追加提醒（不阻断）
  askUserAt: 6               # 到第几次才允许问用户一次
  argumentsPreviewChars: 0   # 0 = 只报参数长度，不把参数内容写进上下文（防密钥进日志）；排查时临时调大
  logFile: ''                # 命中日志；空 = <DSH_HOME>/storages/loop-guard/events.jsonl，null 关闭
  exclude: [todo_write, job_output, job_list, job_kill, ask_user_question, send_message, present,
            http_request, mcp_connector_configure, mcp_connector_reconfigure, mcp_connector_import_json]
  include: []                # 非空时只对这些工具生效
