name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 验收环境：项目实际运行在 Windows，这里是发布门禁
  test:
    name: test (windows · 验收)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装解压与配置依赖
        run: |
          python -m pip install --upgrade pip
          pip install zstandard pyyaml
      - name: 回归测试（40 项）
        run: python tests/run_tests.py
      - name: 包自检（结构 / 引用 / 陈旧词 / 数字单源）
        run: python scripts/audit_pack.py

  # 探测环境：Linux 未做验收，只提前暴露路径/编码类问题，不阻塞合并
  probe:
    name: probe (linux · 不阻塞)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install zstandard pyyaml
      - name: 回归测试
        run: python tests/run_tests.py
      - name: 包自检
        run: python scripts/audit_pack.py
