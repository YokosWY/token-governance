name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # 验收环境：项目实际运行在 Windows，这里是唯一的发布门禁
  test:
    name: test (windows · 验收)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装解压与配置依赖
        run: |
          python -m pip install --upgrade pip
          pip install zstandard pyyaml
      - name: 环境自检（Python / pyyaml / 解压器 / node / dsh_home）
        run: python scripts/env_check.py --json
      - name: 回归测试（136 项）
        run: python tests/run_tests.py
      - name: 包自检（结构 / 引用 / 陈旧词 / 数字单源）
        run: python scripts/audit_pack.py

  # 兼容性矩阵：证明「没有 Windows 专有依赖、没有只在新 Python 上能跑的语法」。
  # 2026-10-24 起是真实门禁（首轮全绿后转正）；红了先判断是产品问题还是平台用例问题，别直接改断言。
  matrix:
    name: matrix (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install zstandard pyyaml
      - name: 环境自检
        run: python scripts/env_check.py
      - name: 不依赖本机数据的门禁
        run: |
          python scripts/audit_pack.py
          python scripts/gen_metrics.py --check
      - name: 回归测试（平台相关用例在用例内判断，未适配的跳过而不是失败）
        run: python tests/run_tests.py

  # Python 3.14 专项：它自带 compression.zstd，**故意不装 zstandard**，用来守住
  # v0.14.1 修的那个 bug —— 曾经自检判「缺解压器」，而所有脚本都能解。
  # 只装 pyyaml，等于模拟「新机器上什么都没额外装」的真实起点。
  py314-windows:
    name: py314 (windows · 只装 pyyaml)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 只装 pyyaml（故意不装 zstandard）
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: 环境自检（unzip 应报 Python 内建 compression.zstd）
        run: python scripts/env_check.py --json
      - name: 回归测试（夹具也走内建压缩）
        run: python tests/run_tests.py
      - name: 包自检
        run: python scripts/audit_pack.py

  # 探测环境：Linux 全量测试跑一遍，只提前暴露路径/编码类问题，不阻塞合并
  probe:
    name: probe (linux · 不阻塞)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install zstandard pyyaml
      - name: 回归测试
        run: python tests/run_tests.py
      - name: 包自检
        run: python scripts/audit_pack.py

  # 首次上手：模拟「刚 clone 下来、还没用过 DSH 的新机器」把安装段那几条命令跑一遍。
  # 这一条抓的是「本地有数据才绿」的整类问题（doctor 的 CI 红灯就是这么来的）。
  first-run:
    name: first-run (windows · 干净机器)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install zstandard pyyaml
      - name: 首次上手脚本（空 home + 空技能目录）
        run: python tests/first_run.py
